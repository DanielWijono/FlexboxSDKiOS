name: FlexDemo
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  Flexbox:
    path: ../..
targets:
  FlexDemo:
    type: application
    platform: iOS
    sources: [FlexDemo]
    dependencies:
      - package: Flexbox
        product: FlexboxKit
      - package: Flexbox
        product: FlexboxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flexbox.FlexDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: FlexDemo/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
schemes:
  FlexDemo:
    build:
      targets:
        FlexDemo: all
    run:
      config: Debug
      preActions:
        # iOS 15 simulator runtimes can fail to update an installed app built by
        # newer Xcode ("Could not hardlink copy"). Remove the old copy first.
        - name: Uninstall previous FlexDemo
          settingsTarget: FlexDemo
          script: |
            if [ "$PLATFORM_NAME" = "iphonesimulator" ] && [ -n "$TARGET_DEVICE_IDENTIFIER" ]; then
              xcrun simctl uninstall "$TARGET_DEVICE_IDENTIFIER" dev.flexbox.FlexDemo >/dev/null 2>&1 || true
            fi
